worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 9400;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;

    # electron-builder 的产物目录（latest.yml + 安装包 + blockmap）
    location /updates/ {
      autoindex on;
      add_header Cache-Control "no-store";
    }
  }
}
