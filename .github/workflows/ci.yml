name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      # 冒烟测试会启动隐藏的 Electron 窗口，需要图形会话
      - run: npm run test:smoke
      - run: npm audit --omit=dev
